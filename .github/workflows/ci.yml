name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Test
        run: sh tests/run.sh

      - name: Gitleaks
        run: |
          set -eu
          ver=8.30.1
          file="gitleaks_${ver}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${ver}/${file}"
          curl -fsSL -o "$file" "$url"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${file}" | sha256sum -c -
          tar -xzf "$file" gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --verbose
